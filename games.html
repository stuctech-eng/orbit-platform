<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Games — ORBIT Platform</title>
<link rel="stylesheet" href="assets/styles.css">
<style>
  .status-msg { font-size: 13px; font-weight: 300; color: var(--dim-40); min-height: 18px; }
</style>
</head>
<body>

<nav class="platform-nav">
  <a href="index.html" class="wordmark">ORBIT</a>
  <div class="links">
    <a href="pages/about.html">About</a>
    <a href="pages/account.html">Account</a>
  </div>
</nav>

<section class="section">
  <div class="section-inner">
    <div class="eyebrow">Games</div>
    <h2>One game today.<br>Built to hold more.</h2>

    <div class="card-grid" style="margin-top:44px;">
      <div class="card" style="grid-column: 1 / -1;">
        <h3 style="font-size:20px;">ORBIT</h3>
        <p style="margin-bottom:20px;">A minimalist memory scanner. Available now.</p>
        <div class="btn-row" style="justify-content:flex-start;" id="orbitCta">
          <!-- Fase C: gevuld door script hieronder, op basis van Firebase
               Auth-status + Firestore entitlements/{uid}/games/orbit.
               NIET beveiliging van de game zelf — nog altijd een kale
               link naar de game-URL. De echte toegangscontrole in de
               game zelf is Fase D (AccessController, nog niet gebouwd —
               zie docs/access-controller-v1-technisch-ontwerp.md). -->
        </div>
      </div>
    </div>

    <p class="body" style="margin-top:36px; opacity:0.5;">More cognitive training games are on the way.</p>
  </div>
</section>

<footer class="platform-footer">
  ORBIT Platform · stuctech-eng
</footer>

<script type="module">
  // Fase D — "Play ORBIT" is nu geen kale link meer. Elke klik vraagt
  // een vers, kortlevend handoff-token aan bij /api/issue-access-token,
  // dat daar de entitlement ECHT herverifieert tegen Firestore (nooit
  // vertrouwend op de staat van deze pagina). Pas na een geldig
  // antwoord wordt er doorgestuurd naar de game, met het token als
  // querystring. De game zelf controleert alleen het token (zie
  // stuctech-eng/orbit, #accessGate) — nooit Firestore rechtstreeks.
  import { auth, db, onAuthStateChanged, doc, getDoc } from 'assets/firebase-init.js';

  var ORBIT_GAME_URL = 'https://orbit-rho-ruby.vercel.app/';
  var cta = document.getElementById('orbitCta');

  function renderPlayButton(user) {
    cta.innerHTML = '<button class="btn btn-primary" id="playBtn">Play ORBIT</button>' +
      '<a class="btn btn-secondary" href="pages/demo.html">Try the demo</a>' +
      '<div class="status-msg" id="playStatus" style="width:100%; margin-top:10px;"></div>';

    var playBtn = document.getElementById('playBtn');
    var playStatus = document.getElementById('playStatus');

    playBtn.addEventListener('click', async function () {
      playBtn.disabled = true;
      playStatus.textContent = 'Checking access…';

      try {
        var idToken = await user.getIdToken();
        var res = await fetch('/api/issue-access-token', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ idToken: idToken, gameId: 'orbit' })
        });
        var data = await res.json();

        if (res.ok && data.success && data.token) {
          window.location.href = ORBIT_GAME_URL + '?token=' + encodeURIComponent(data.token);
        } else {
          playStatus.textContent = data.error || 'Could not start ORBIT — try again.';
          playBtn.disabled = false;
        }
      } catch (err) {
        playStatus.textContent = 'Network error — try again.';
        playBtn.disabled = false;
      }
    });
  }

  onAuthStateChanged(auth, async function (user) {
    if (!user) {
      cta.innerHTML = '<a class="btn btn-primary" href="pages/login.html">Sign in</a>' +
        '<a class="btn btn-secondary" href="pages/demo.html">Try the demo</a>';
      return;
    }

    try {
      var entitlementRef = doc(db, 'entitlements', user.uid, 'games', 'orbit');
      var snap = await getDoc(entitlementRef);
      var hasAccess = snap.exists() && snap.data().status === 'active';

      if (hasAccess) {
        renderPlayButton(user);
      } else {
        cta.innerHTML = '<a class="btn btn-primary" href="pages/beta.html">Enter beta code</a>' +
          '<a class="btn btn-secondary" href="pages/demo.html">Try the demo</a>';
      }
    } catch (err) {
      cta.innerHTML = '<a class="btn btn-primary" href="pages/account.html">My account</a>' +
        '<a class="btn btn-secondary" href="pages/demo.html">Try the demo</a>';
    }
  });
</script>

</body>
</html>
