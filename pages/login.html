<!DOCTYPE html>
<html lang="en">
<head>
<link rel="apple-touch-icon" href="../icons/apple-touch-icon.png">
<link rel="icon" href="../icons/favicon.png">
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>ORBIT — Sign in</title>
<link rel="stylesheet" href="../assets/styles.css">
<style>
  .auth-form { margin-top: 36px; display: flex; flex-direction: column; gap: 14px; text-align: left; }
  .auth-form label { font-size: 13px; color: var(--dim-40); margin-bottom: -6px; }
  .auth-form input {
    width: 100%;
    min-height: 52px;
    background: var(--dim-06);
    border: 1px solid var(--dim-25);
    border-radius: 14px;
    color: var(--white);
    padding: 0 16px;
    font-size: 16px;
  }
  .auth-form input:focus { outline: none; border-color: var(--white); }
  .status-msg { font-size: 14px; font-weight: 300; min-height: 20px; margin-top: 4px; }
  .status-msg.error { color: rgba(255,120,120,0.9); }
  .status-msg.success { color: rgba(140,255,180,0.9); }
  .switch-link { margin-top: 24px; font-size: 14px; color: var(--dim-40); }
  .switch-link a { color: var(--white); text-decoration: underline; }
  .forgot-link { font-size: 13px; color: var(--dim-40); text-decoration: underline; align-self: flex-end; margin-top: -6px; }
</style>
</head>
<body>

<nav class="platform-nav">
  <a href="../index.html" class="wordmark">ORBIT</a>
  <div class="links">
    <a href="../games.html">Games</a>
  </div>
</nav>

<section class="section">
  <div class="section-inner" id="view">
    <div class="eyebrow">Sign in</div>
    <h2>Welcome back.</h2>

    <form class="auth-form" id="loginForm" autocomplete="off">
      <label for="email">Email</label>
      <input id="email" name="email" type="email" placeholder="you@example.com" required>

      <label for="password">Password</label>
      <input id="password" name="password" type="password" placeholder="Your password" required>

      <a class="forgot-link" href="#" id="forgotLink">Forgot password?</a>

      <div class="btn-row" style="justify-content:flex-start; margin-top:6px;">
        <button class="btn btn-primary" type="submit" id="submitBtn">Sign in</button>
      </div>
      <div class="status-msg" id="statusMsg" role="status" aria-live="polite"></div>
    </form>

    <p class="switch-link">No account yet? <a href="register.html">Create one</a></p>
  </div>
</section>

<footer class="platform-footer">
  ORBIT Platform · stuctech-eng
</footer>

<script type="module">
  import {
    auth, db, signInWithEmailAndPassword, sendPasswordResetEmail,
    sendEmailVerification, signOut, reload, doc, getDoc
  } from '../assets/firebase-init.js';

  var form = document.getElementById('loginForm');
  var btn = document.getElementById('submitBtn');
  var status = document.getElementById('statusMsg');
  var view = document.getElementById('view');
  var forgotLink = document.getElementById('forgotLink');

  function setStatus(text, type) {
    status.textContent = text;
    status.className = 'status-msg' + (type ? ' ' + type : '');
  }

  forgotLink.addEventListener('click', async function (e) {
    e.preventDefault();
    var email = document.getElementById('email').value.trim();
    if (!email) {
      setStatus('Enter your email above first, then tap "Forgot password?" again.', 'error');
      return;
    }
    try {
      await sendPasswordResetEmail(auth, email);
      setStatus('Password reset email sent — check your inbox.', 'success');
    } catch (err) {
      setStatus('Could not send reset email. Check the address and try again.', 'error');
    }
  });

  form.addEventListener('submit', async function (e) {
    e.preventDefault();
    var email = document.getElementById('email').value.trim();
    var password = document.getElementById('password').value;

    btn.disabled = true;
    setStatus('Signing in…', '');

    var userCredential;
    try {
      userCredential = await signInWithEmailAndPassword(auth, email, password);
    } catch (err) {
      setStatus(firebaseErrorToMessage(err), 'error');
      btn.disabled = false;
      return;
    }

    var user = userCredential.user;
    await reload(user);

    if (!user.emailVerified) {
      view.innerHTML =
        '<div class="eyebrow">Almost there</div>' +
        '<h2>Verify your email.</h2>' +
        '<p class="lead">We sent a link to <strong>' + user.email + '</strong> — confirm it, then sign in again.</p>' +
        '<div class="btn-row">' +
          '<button class="btn btn-primary" id="resendBtn">Resend email</button>' +
          '<button class="btn btn-secondary" id="signOutBtn">Sign out</button>' +
        '</div>' +
        '<div class="status-msg" id="resendStatus" style="margin-top:16px;"></div>';

      document.getElementById('resendBtn').addEventListener('click', async function () {
        try {
          await sendEmailVerification(user);
          document.getElementById('resendStatus').textContent = 'Verification email sent again.';
          document.getElementById('resendStatus').className = 'status-msg success';
        } catch (err) {
          document.getElementById('resendStatus').textContent = 'Could not resend — try again shortly.';
          document.getElementById('resendStatus').className = 'status-msg error';
        }
      });
      document.getElementById('signOutBtn').addEventListener('click', async function () {
        await signOut(auth);
        window.location.href = 'login.html';
      });
      return;
    }

    // Verified — sync accountStatus server-side (idempotent), then route
    // based on whether an active ORBIT entitlement already exists.
    try {
      var idToken = await user.getIdToken();
      await fetch('/api/confirm-verification', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ idToken: idToken })
      });

      var entitlementRef = doc(db, 'entitlements', user.uid, 'games', 'orbit');
      var entitlementSnap = await getDoc(entitlementRef);

      if (entitlementSnap.exists() && entitlementSnap.data().status === 'active') {
        window.location.href = '../games.html';
      } else {
        window.location.href = 'beta.html';
      }
    } catch (err) {
      window.location.href = '../games.html';
    }
  });

  function firebaseErrorToMessage(err) {
    var code = err && err.code ? err.code : '';
    if (code === 'auth/invalid-credential' || code === 'auth/wrong-password' || code === 'auth/user-not-found') {
      return 'Incorrect email or password.';
    }
    if (code === 'auth/too-many-requests') return 'Too many attempts — try again in a moment.';
    return 'Something went wrong. Please try again.';
  }
</script>

</body>
</html>
