<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>ORBIT — Beta access</title>
<link rel="stylesheet" href="../assets/styles.css">
<style>
  .code-form { margin-top: 40px; display: flex; flex-direction: column; gap: 14px; align-items: center; }
  .code-input {
    width: 100%; max-width: 340px;
    min-height: 54px;
    text-align: center;
    /* 0.3em letter-spacing was afgestemd op korte codes (bv. "TEST2026",
       8 tekens) — bij het nieuwe ORBIT-XXXX-XXXX-formaat (15 tekens,
       zie api/admin-create-code.js) paste dat niet meer. Kleinere
       letter-spacing + iets kleiner lettertype, blijft prima leesbaar. */
    font-size: 18px;
    letter-spacing: 0.1em;
    text-transform: uppercase;
    background: var(--dim-06);
    border: 1px solid var(--dim-25);
    border-radius: 14px;
    color: var(--white);
    padding: 0 16px;
  }
  .code-input:focus { outline: none; border-color: var(--white); }
  .status-msg { font-size: 14px; font-weight: 300; min-height: 20px; margin-top: 4px; }
  .status-msg.error { color: rgba(255,120,120,0.9); }
  .status-msg.success { color: rgba(140,255,180,0.9); }
  .btn-primary:disabled { opacity: 0.4; }
</style>
</head>
<body>

<nav class="platform-nav">
  <a href="../index.html" class="wordmark">ORBIT</a>
  <div class="links">
    <a href="account.html">Account</a>
  </div>
</nav>

<section class="section">
  <div class="section-inner" id="view">
    <div class="eyebrow">Checking your account…</div>
  </div>
</section>

<footer class="platform-footer">
  ORBIT Platform · stuctech-eng
</footer>

<script type="module">
  import { auth, onAuthStateChanged } from '../assets/firebase-init.js';

  var view = document.getElementById('view');

  function renderCodeForm(user) {
    view.innerHTML =
      '<div class="eyebrow">Beta access</div>' +
      '<h2>Enter your invite code.</h2>' +
      '<p class="lead">Signed in as <strong>' + user.email + '</strong>. ' +
      'Enter your invite code to unlock beta access.</p>' +
      '<form class="code-form" id="betaForm" autocomplete="off">' +
        '<input class="code-input" id="codeInput" type="text" inputmode="text" maxlength="20" placeholder="CODE" aria-label="Invite code" required>' +
        '<button class="btn btn-primary" type="submit" id="submitBtn">Unlock</button>' +
        '<div class="status-msg" id="statusMsg" role="status" aria-live="polite"></div>' +
      '</form>';

    var form = document.getElementById('betaForm');
    var input = document.getElementById('codeInput');
    var btn = document.getElementById('submitBtn');
    var status = document.getElementById('statusMsg');

    function setStatus(text, type) {
      status.textContent = text;
      status.className = 'status-msg' + (type ? ' ' + type : '');
    }

    form.addEventListener('submit', async function (e) {
      e.preventDefault();
      var code = input.value.trim();
      if (!code) return;

      btn.disabled = true;
      setStatus('Checking…', '');

      try {
        var idToken = await user.getIdToken();
        var res = await fetch('/api/redeem-beta-code', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ idToken: idToken, code: code })
        });
        var data = await res.json();

        if (res.ok && data.success) {
          setStatus('Access granted. Redirecting…', 'success');
          setTimeout(function () { window.location.href = '../games.html'; }, 700);
        } else {
          setStatus(data.error || 'Invalid code.', 'error');
          btn.disabled = false;
        }
      } catch (err) {
        setStatus('Network error. Please try again.', 'error');
        btn.disabled = false;
      }
    });
  }

  onAuthStateChanged(auth, function (user) {
    if (!user) {
      window.location.href = 'login.html';
      return;
    }
    if (!user.emailVerified) {
      view.innerHTML =
        '<div class="eyebrow">Almost there</div>' +
        '<h2>Verify your email first.</h2>' +
        '<p class="lead">Check your inbox for the verification link, then come back here.</p>' +
        '<div class="btn-row"><a class="btn btn-primary" href="login.html">Back to sign in</a></div>';
      return;
    }
    renderCodeForm(user);
  });
</script>
</body>
</html>
