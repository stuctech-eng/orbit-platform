<!DOCTYPE html>
<html lang="en">
<head>
<link rel="apple-touch-icon" href="../icons/apple-touch-icon.png">
<link rel="icon" href="../icons/favicon.png">
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>ORBIT — Account</title>
<link rel="stylesheet" href="../assets/styles.css">
<style>
  .status-pill {
    display: inline-flex;
    align-items: center;
    gap: 8px;
    padding: 8px 18px;
    border-radius: 999px;
    background: var(--dim-06);
    border: 1px solid var(--dim-12);
    font-size: 13px;
    color: var(--dim-60);
    margin-bottom: 28px;
  }
  .status-pill .dot { width: 8px; height: 8px; border-radius: 50%; background: rgba(140,255,180,0.9); }
  .field-row { text-align: left; margin-top: 28px; }
  .field-row label { display: block; font-size: 13px; color: var(--dim-40); margin-bottom: 6px; }
  .field-row .value { font-size: 16px; color: var(--white); }
  .name-edit { display: flex; gap: 10px; margin-top: 6px; }
  .name-edit input {
    flex: 1;
    min-height: 48px;
    background: var(--dim-06);
    border: 1px solid var(--dim-25);
    border-radius: 12px;
    color: var(--white);
    padding: 0 14px;
    font-size: 15px;
  }
  .status-msg { font-size: 14px; font-weight: 300; min-height: 20px; margin-top: 10px; }
  .status-msg.error { color: rgba(255,120,120,0.9); }
  .status-msg.success { color: rgba(140,255,180,0.9); }
  .danger-zone { margin-top: 48px; padding-top: 28px; border-top: 1px solid var(--dim-12); }
  .btn-danger { background: transparent; border: 1px solid rgba(255,120,120,0.4); color: rgba(255,140,140,0.9); }
</style>
</head>
<body>

<nav class="platform-nav">
  <a href="../index.html" class="wordmark">ORBIT</a>
  <div class="links">
    <a href="../games.html">Games</a>
    <a href="scores.html">My scores</a>
    <a href="feedback.html">Feedback</a>
    <a href="admin-codes.html" id="adminLink" style="display:none;">Admin</a>
  </div>
</nav>

<section class="section">
  <div class="section-inner" id="view">
    <div class="eyebrow">Loading…</div>
  </div>
</section>

<footer class="platform-footer">
  ORBIT Platform · stuctech-eng
</footer>

<script type="module">
  import {
    auth, db, onAuthStateChanged, signOut, reload,
    doc, getDoc, collection, getDocs
  } from '../assets/firebase-init.js';

  var view = document.getElementById('view');

  async function checkAdmin(user) {
    // Puur UX — bepaalt alleen of de link verschijnt. Faalt dit
    // (netwerk, uitgeschakeld, etc.), dan blijft de link simpelweg
    // verborgen; de echte beveiliging in admin-create-code.js is
    // hier op geen enkele manier van afhankelijk.
    try {
      var idToken = await user.getIdToken();
      var res = await fetch('/api/is-admin', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ idToken: idToken })
      });
      var data = await res.json();
      if (data.isAdmin) {
        var link = document.getElementById('adminLink');
        if (link) link.style.display = '';
      }
    } catch (err) {}
  }

  async function render(user) {
    await reload(user);
    checkAdmin(user);

    var userRef = doc(db, 'users', user.uid);
    var userSnap = await getDoc(userRef);

    if (!userSnap.exists()) {
      view.innerHTML =
        '<div class="eyebrow">Account</div>' +
        '<h2>Profile not found.</h2>' +
        '<p class="lead">Something went wrong setting up your profile.</p>' +
        '<div class="btn-row"><button class="btn btn-secondary" id="signOutBtn">Sign out</button></div>';
      document.getElementById('signOutBtn').addEventListener('click', async function () {
        await signOut(auth);
        window.location.href = 'login.html';
      });
      return;
    }

    var profile = userSnap.data();

    var entitlementsSnap = await getDocs(collection(db, 'entitlements', user.uid, 'games'));
    var games = [];
    entitlementsSnap.forEach(function (d) {
      if (d.data().status === 'active') games.push(d.id);
    });

    var gamesHtml = games.length
      ? games.map(function (g) {
          return '<div class="card"><span class="glyph">&#9899;</span><h3>' + g + '</h3><p>Unlocked.</p></div>';
        }).join('')
      : '<p class="body">No games unlocked yet. <a href="beta.html" style="text-decoration:underline;">Enter a beta code</a>.</p>';

    view.innerHTML =
      '<div class="status-pill"><span class="dot"></span>' +
        (user.emailVerified ? 'Email verified' : 'Email not verified') +
      '</div>' +
      '<h2>Welcome back.</h2>' +

      '<div class="field-row">' +
        '<label>Email</label>' +
        '<div class="value">' + profile.email + '</div>' +
      '</div>' +

      '<div class="field-row">' +
        '<label>Display name</label>' +
        '<div class="name-edit">' +
          '<input type="text" id="nameInput" maxlength="24" value="' + escapeHtml(profile.displayName) + '">' +
          '<button class="btn btn-secondary" id="saveNameBtn">Save</button>' +
        '</div>' +
        '<div class="status-msg" id="nameStatus"></div>' +
      '</div>' +

      '<div class="field-row">' +
        '<label>Games</label>' +
        '<div class="card-grid">' + gamesHtml + '</div>' +
      '</div>' +

      '<div class="btn-row" style="margin-top:40px; justify-content:flex-start;">' +
        '<button class="btn btn-secondary" id="signOutBtn">Sign out</button>' +
      '</div>' +

      '<div class="danger-zone">' +
        '<p class="body">Deleting your account revokes access immediately. Your data is kept for 30 days in case you change your mind, then permanently removed.</p>' +
        '<div class="btn-row" style="justify-content:flex-start; margin-top:12px;">' +
          '<button class="btn btn-danger" id="deleteBtn">Delete account</button>' +
        '</div>' +
        '<div class="status-msg" id="deleteStatus"></div>' +
      '</div>';

    document.getElementById('signOutBtn').addEventListener('click', async function () {
      await signOut(auth);
      window.location.href = '../index.html';
    });

    document.getElementById('saveNameBtn').addEventListener('click', async function () {
      var newName = document.getElementById('nameInput').value.trim();
      var nameStatus = document.getElementById('nameStatus');
      nameStatus.textContent = 'Saving…';
      nameStatus.className = 'status-msg';
      try {
        var idToken = await user.getIdToken();
        var res = await fetch('/api/update-displayname', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ idToken: idToken, displayName: newName })
        });
        var data = await res.json();
        if (res.ok && data.success) {
          nameStatus.textContent = 'Saved.';
          nameStatus.className = 'status-msg success';
        } else {
          nameStatus.textContent = data.error || 'Could not save.';
          nameStatus.className = 'status-msg error';
        }
      } catch (err) {
        nameStatus.textContent = 'Network error.';
        nameStatus.className = 'status-msg error';
      }
    });

    document.getElementById('deleteBtn').addEventListener('click', async function () {
      if (!window.confirm('Delete your ORBIT account? This revokes access immediately. Your data is kept 30 days, then permanently removed.')) {
        return;
      }
      var deleteStatus = document.getElementById('deleteStatus');
      deleteStatus.textContent = 'Processing…';
      deleteStatus.className = 'status-msg';
      try {
        var idToken = await user.getIdToken();
        var res = await fetch('/api/request-account-deletion', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ idToken: idToken })
        });
        var data = await res.json();
        if (res.ok && data.success) {
          await signOut(auth);
          window.location.href = '../index.html';
        } else {
          deleteStatus.textContent = data.error || 'Could not process request.';
          deleteStatus.className = 'status-msg error';
        }
      } catch (err) {
        deleteStatus.textContent = 'Network error.';
        deleteStatus.className = 'status-msg error';
      }
    });
  }

  function escapeHtml(str) {
    var div = document.createElement('div');
    div.textContent = str;
    return div.innerHTML;
  }

  onAuthStateChanged(auth, function (user) {
    if (!user) {
      window.location.href = 'login.html';
      return;
    }
    render(user);
  });
</script>
</body>
</html>
