<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>ORBIT — Demo</title>
<link rel="stylesheet" href="../assets/styles.css">
<style>
  html, body { height: 100%; overflow: hidden; touch-action: none; }
  #demoStage { position: fixed; inset: 0; }
  #demoCanvas { position: absolute; inset: 0; width: 100%; height: 100%; }
  .demo-nav {
    position: fixed; top: 0; left: 0; right: 0; z-index: 20;
    display: flex; align-items: center; justify-content: space-between;
    padding: max(18px, env(safe-area-inset-top)) 20px 14px;
  }
  .demo-nav a { font-size: 13px; letter-spacing: 0.1em; color: rgba(255,255,255,0.4); }
  .demo-text {
    position: fixed; left: 0; right: 0; z-index: 15;
    top: 40%; text-align: center; padding: 0 24px;
    opacity: 0; transition: opacity 0.5s ease;
    pointer-events: none;
  }
  .demo-text.visible { opacity: 1; }
  .demo-text span {
    display: inline-block;
    background: rgba(0,0,0,0.8);
    padding: 12px 20px;
    border-radius: 999px;
    font-size: 16px;
    font-weight: 400;
  }
  .demo-panel {
    position: fixed; left: 0; right: 0; z-index: 20;
    bottom: max(50px, env(safe-area-inset-bottom) + 30px);
    text-align: center;
    opacity: 0; pointer-events: none;
    transition: opacity 0.5s ease;
  }
  .demo-panel.visible { opacity: 1; pointer-events: auto; }
</style>
</head>
<body>

<nav class="demo-nav">
  <a href="../index.html">← ORBIT</a>
  <a href="about.html">About</a>
</nav>

<div id="demoStage">
  <canvas id="demoCanvas"></canvas>
</div>

<div class="demo-text" id="demoText"><span></span></div>

<div class="demo-panel" id="demoPanel">
  <div style="margin-bottom:18px; font-size:15px; color:rgba(255,255,255,0.6);">Curious what a full session feels like?</div>
  <div class="btn-row">
    <a class="btn btn-primary" href="beta.html" id="betaLink">Request beta access</a>
    <a class="btn btn-secondary" href="#" id="replayBtn">Try again</a>
  </div>
</div>

<script>
(function () {
  const canvas = document.getElementById('demoCanvas');
  const ctx = canvas.getContext('2d', { alpha: false });
  const textEl = document.getElementById('demoText');
  const panelEl = document.getElementById('demoPanel');
  let W = 0, H = 0, DPR = Math.min(2, window.devicePixelRatio || 1);

  function resize() {
    W = window.innerWidth; H = window.innerHeight;
    canvas.width = W * DPR; canvas.height = H * DPR;
    canvas.style.width = W + 'px'; canvas.style.height = H + 'px';
    ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
  }
  window.addEventListener('resize', resize);
  resize();

  function rand(a, b) { return a + Math.random() * (b - a); }
  let textTimer = null;
  function showText(msg, autoFadeMs) {
    clearTimeout(textTimer);
    textEl.firstChild.textContent = msg;
    textEl.classList.add('visible');
    if (autoFadeMs) textTimer = setTimeout(() => textEl.classList.remove('visible'), autoFadeMs);
  }
  function hideText() { clearTimeout(textTimer); textEl.classList.remove('visible'); }

  // ---- One demo round: 3 cells, same visual language as the real game ----
  const R = 40;
  let cells = [];
  function spawnCells() {
    cells = [];
    for (let i = 0; i < 3; i++) {
      const angle = rand(0, Math.PI * 2);
      const speed = rand(20, 30);
      cells.push({
        x: rand(R * 2, W - R * 2),
        y: rand(H * 0.3, H * 0.7),
        vx: Math.cos(angle) * speed,
        vy: Math.sin(angle) * speed,
        r: R,
        target: false,
        revealed: false,
        reveal: 0,
        revealUntil: 0,
        feedback: 0,
        feedbackColor: null,
        seed: Math.random() * 1000
      });
    }
    cells[Math.floor(Math.random() * cells.length)].target = true;
  }
  spawnCells();

  function stepPhysics(dt) {
    for (const c of cells) {
      c.x += c.vx * dt; c.y += c.vy * dt;
      const marginX = c.r + 16, marginTop = c.r + 70, marginBottom = c.r + 140;
      if (c.x < marginX) { c.x = marginX; c.vx = Math.abs(c.vx); }
      if (c.x > W - marginX) { c.x = W - marginX; c.vx = -Math.abs(c.vx); }
      if (c.y < marginTop) { c.y = marginTop; c.vy = Math.abs(c.vy); }
      if (c.y > H - marginBottom) { c.y = H - marginBottom; c.vy = -Math.abs(c.vy); }
    }
  }

  function drawCell(c, t) {
    if (c.feedback > 0) c.feedback *= 0.9;
    const driftAngle = t * 0.00035 + c.seed;
    const driftX = Math.cos(driftAngle) * c.r * 0.035;
    const driftY = Math.sin(driftAngle) * c.r * 0.035;

    ctx.save();
    ctx.translate(c.x, c.y);
    if (c.feedback > 0.01 && c.feedbackColor === 'red') {
      ctx.translate(Math.sin(t * 0.09) * 2.2 * c.feedback, Math.cos(t * 0.11) * 1.3 * c.feedback);
    }
    let scale = 1;
    if (c.feedback > 0.01 && c.feedbackColor === 'white') scale = 1 + 0.02 * c.feedback;
    ctx.scale(scale, scale);

    ctx.shadowColor = 'rgba(255,255,255,0.4)';
    ctx.shadowBlur = 20;
    ctx.beginPath();
    ctx.arc(0, 0, c.r, 0, Math.PI * 2);
    const material = ctx.createRadialGradient(-c.r * 0.15 + driftX, -c.r * 0.2 + driftY, c.r * 0.2, 0, 0, c.r * 1.05);
    material.addColorStop(0, 'rgba(255,255,255,0.97)');
    material.addColorStop(0.7, 'rgba(240,240,244,0.95)');
    material.addColorStop(1, 'rgba(222,224,230,0.92)');
    ctx.fillStyle = material;
    ctx.fill();
    ctx.shadowBlur = 0;

    ctx.beginPath();
    ctx.ellipse(-c.r * 0.2 + driftX, -c.r * 0.24 + driftY, c.r * 0.34, c.r * 0.22, -0.4, 0, Math.PI * 2);
    ctx.fillStyle = 'rgba(255,255,255,0.2)';
    ctx.fill();

    if (c.reveal > 0) {
      ctx.beginPath();
      ctx.arc(0, 0, c.r, 0, Math.PI * 2);
      ctx.fillStyle = `rgba(0,0,0,${c.reveal * 0.82})`;
      ctx.fill();
    }
    if (c.feedback > 0.01) {
      ctx.beginPath();
      ctx.arc(0, 0, c.r * (1 + (1 - c.feedback) * 0.5), 0, Math.PI * 2);
      ctx.strokeStyle = c.feedbackColor === 'white' ? `rgba(255,255,255,${c.feedback * 0.7})` : `rgba(255,70,70,${c.feedback * 0.7})`;
      ctx.lineWidth = 2;
      ctx.stroke();
    }
    ctx.restore();
  }

  // ---- Scanner (simplified — same visual identity, single pass) ----
  const SCAN_DURATION = 3200;
  let scanY = 0, scanStart = 0, scanActive = false, scanDone = false;
  let revealed = false;

  function beginScan() {
    scanActive = true; scanDone = false; revealed = false;
    scanStart = performance.now();
    scanY = H + 160;
    showText('Watch.', 1800);
  }

  function updateScan(t) {
    const elapsed = t - scanStart;
    const prog = Math.min(1, elapsed / SCAN_DURATION);
    scanY = (H + 160) - prog * (H + 320);

    for (const c of cells) {
      if (c.target && !revealed && Math.abs(c.y - scanY) < 24) {
        revealed = true;
        c.revealed = true;
        c.reveal = 1;
      }
    }
    if (revealed) {
      const c = cells.find(cc => cc.target);
      if (c && c.reveal > 0) c.reveal = Math.max(0, c.reveal - 0.02);
    }
    if (prog >= 1) {
      scanActive = false; scanDone = true;
      beginMemory();
    }
  }

  function drawScan() {
    if (!scanActive) return;
    ctx.save();
    const grad = ctx.createLinearGradient(0, scanY + 130, 0, scanY);
    grad.addColorStop(0, 'rgba(255,255,255,0)');
    grad.addColorStop(1, 'rgba(255,255,255,0.35)');
    ctx.fillStyle = grad;
    ctx.fillRect(0, scanY, W, 130);
    ctx.fillStyle = '#ffffff';
    ctx.fillRect(0, Math.round(scanY), W, 1);
    ctx.restore();
  }

  let canTap = false;
  function beginMemory() {
    canTap = true;
    showText('Which cell was it?', 0);
  }

  function handleTap(x, y) {
    if (!canTap) return;
    let hit = null, best = Infinity;
    for (const c of cells) {
      const d = Math.hypot(x - c.x, y - c.y);
      if (d <= c.r * 1.4 && d < best) { best = d; hit = c; }
    }
    if (!hit) return;
    canTap = false;
    hideText();
    if (hit.target) {
      hit.feedback = 1; hit.feedbackColor = 'white';
      setTimeout(() => showText('Correct.', 0), 250);
    } else {
      hit.feedback = 1; hit.feedbackColor = 'red';
      const target = cells.find(c => c.target);
      target.reveal = 1;
      setTimeout(() => showText('That one was it.', 0), 250);
    }
    setTimeout(() => { hideText(); panelEl.classList.add('visible'); }, 1400);
  }
  canvas.addEventListener('pointerdown', (e) => handleTap(e.clientX, e.clientY));

  document.getElementById('replayBtn').addEventListener('click', (e) => {
    e.preventDefault();
    panelEl.classList.remove('visible');
    spawnCells();
    setTimeout(beginScan, 500);
  });

  let lastT = performance.now();
  function frame(t) {
    const dt = Math.min(0.032, (t - lastT) / 1000);
    lastT = t;
    ctx.fillStyle = '#000000';
    ctx.fillRect(0, 0, W, H);
    stepPhysics(dt);
    drawScan();
    for (const c of cells) drawCell(c, t);
    requestAnimationFrame(frame);
  }
  requestAnimationFrame(frame);

  setTimeout(beginScan, 900);
})();
</script>
</body>
</html>
