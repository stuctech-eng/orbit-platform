<!DOCTYPE html>
<html lang="en">
<head>
<link rel="apple-touch-icon" href="../icons/apple-touch-icon.png">
<link rel="icon" href="../icons/favicon.png">
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>ORBIT — Leaderboard</title>
<link rel="stylesheet" href="../assets/styles.css">
<style>
  /* Modus-tabs: één rij direct onder de platformbalk, blijft staan tijdens
     het scrollen. Past het niet, dan veeg je zijwaarts. */
  .lb-bar { position: sticky; top: var(--nav-h); z-index: 40; margin-top: var(--nav-h); background: rgba(0,0,0,0.92); -webkit-backdrop-filter: blur(8px); backdrop-filter: blur(8px); border-bottom: 1px solid var(--dim-12); }
  .lb-bar::after { content: ''; position: absolute; top: 0; right: 0; bottom: 0; width: 24px; background: linear-gradient(to left, #000, transparent); pointer-events: none; }
  .tabs { display: flex; gap: 6px; overflow-x: auto; scrollbar-width: none; -webkit-overflow-scrolling: touch; scroll-snap-type: x proximity; padding: 8px 24px 12px; }
  .tabs::-webkit-scrollbar { display: none; }
  .tab { flex: none; scroll-snap-align: center; appearance: none; background: transparent; border: 1px solid transparent; font: inherit; font-size: 14px; padding: 9px 16px; border-radius: 999px; color: var(--dim-60); cursor: pointer; white-space: nowrap; touch-action: manipulation; }
  .tab.active { background: var(--white); color: #000; font-weight: 600; }
  .tab:not(.active):active { background: var(--dim-12); }
  .tab:focus-visible { outline: 2px solid var(--white); outline-offset: 2px; }
  .lb-section { min-height: 0; justify-content: flex-start; padding: 8px 24px 60px; }
  .entry-row { display: flex; justify-content: space-between; padding: 12px 0; border-bottom: 1px solid var(--dim-12); text-align: left; }
  .entry-rank { color: var(--dim-40); width: 32px; }
  .entry-name { flex: 1; }
  .entry-value { font-weight: 600; }
  .empty { font-size: 14px; color: var(--dim-40); text-align: left; }
</style>
</head>
<body>

<nav class="platform-nav">
  <a href="../index.html" class="wordmark">ORBIT</a>
  <div class="links">
    <a href="launch.html">Back to ORBIT</a>
    <a href="../games.html">Games</a>
    <a href="scores.html">My scores</a>
  </div>
</nav>

<div class="lb-bar"><div class="tabs" id="tabs" role="tablist" aria-label="Game mode"></div></div>

<section class="section lb-section">
  <div class="section-inner">
    <div id="entries">Loading…</div>
  </div>
</section>

<footer class="platform-footer">
  ORBIT Platform · stuctech-eng
</footer>

<script type="module">
  // Fase H — leest leaderboards/orbit_{modeId}/entries, gesorteerd op
  // de primaire rankingwaarde per modus. Eigen leaderboard per modus,
  // geen gecombineerd overzicht (H2/H5-ontwerpprincipe). Publiek
  // leesbaar per de Fase H Firestore Rules, geen login vereist om te
  // bekijken — wel om op "My scores" te komen.
  import { db, collection, getDocs, query, orderBy, limit } from '../assets/firebase-init.js';

  var MODES = [
    { id: 'classic', label: 'Classic', primary: 'ladderIndex', primaryLabel: 'Level' },
    { id: 'tracking', label: 'Getallen volgen', primary: 'balls', primaryLabel: 'Ballen' },
    { id: 'pattern', label: 'Patroon', primary: 'balls', primaryLabel: 'Ballen' },
    { id: 'sequence', label: 'Sequence Memory', primary: 'length', primaryLabel: 'Lengte' },
    { id: 'telefoon', label: 'Telefoon', primary: 'correct', primaryLabel: 'Op rij' },
  ];

  var tabsEl = document.getElementById('tabs');
  var entriesEl = document.getElementById('entries');

  MODES.forEach(function (mode, i) {
    var tab = document.createElement('button');
    tab.type = 'button';
    tab.className = 'tab' + (i === 0 ? ' active' : '');
    tab.setAttribute('role', 'tab');
    tab.setAttribute('aria-selected', i === 0 ? 'true' : 'false');
    tab.textContent = mode.label;
    tab.onclick = function () { selectMode(mode, tab); };
    tabsEl.appendChild(tab);
  });

  function selectMode(mode, tabEl) {
    Array.from(tabsEl.children).forEach(function (t) {
      t.classList.remove('active');
      t.setAttribute('aria-selected', 'false');
    });
    tabEl.classList.add('active');
    tabEl.setAttribute('aria-selected', 'true');
    // Gekozen tab netjes in het midden van de rij.
    tabsEl.scrollTo({ left: tabEl.offsetLeft - (tabsEl.clientWidth - tabEl.offsetWidth) / 2, behavior: 'smooth' });
    loadLeaderboard(mode);
  }

  async function loadLeaderboard(mode) {
    entriesEl.innerHTML = 'Loading…';
    try {
      var entriesRef = collection(db, 'leaderboards', 'orbit_' + mode.id, 'entries');
      var q = query(entriesRef, orderBy(mode.primary, 'desc'), limit(20));
      var snap = await getDocs(q);

      if (snap.empty) {
        entriesEl.innerHTML = '<div class="empty">No entries yet.</div>';
        return;
      }

      var rank = 1;
      var html = '';
      snap.forEach(function (doc) {
        var data = doc.data();
        html +=
          '<div class="entry-row">' +
            '<div class="entry-rank">#' + rank + '</div>' +
            '<div class="entry-name">' + (data.displayName || 'Player') + '</div>' +
            '<div class="entry-value">' + data[mode.primary] + '</div>' +
          '</div>';
        rank++;
      });
      entriesEl.innerHTML = html;
    } catch (err) {
      entriesEl.innerHTML = '<div class="empty">Could not load leaderboard.</div>';
    }
  }

  loadLeaderboard(MODES[0]);
</script>
<script src="../assets/nav.js"></script>
</body>
</html>
